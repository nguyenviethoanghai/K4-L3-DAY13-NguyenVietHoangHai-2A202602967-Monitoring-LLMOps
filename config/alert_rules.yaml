alerts:
  - name: high_p95_latency
    severity: critical
    condition: latency_p95 > 3000ms
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2%
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-2
  - name: low_quality_score
    severity: warning
    condition: quality_score_mean < 0.75
    duration: 5m
    type: symptom-based
    channel: slack
    owner: llm-prompt-team
    runbook: docs/alerts.md#alert-3
